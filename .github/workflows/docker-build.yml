name: Docker Build Pipeline - Construcción de Contenedor Server

on:
  push:
    paths:
      - 'server/**'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docker-compose.yml'

jobs:
  docker-build-test:
    name: 🐳 Construcción y Verificación de Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Construir Imagen del Servidor FastAPI / Inferencia
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          tags: iot-invernadero-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Confirmación
        run: echo "Imagen Docker construida y validada sin errores."
