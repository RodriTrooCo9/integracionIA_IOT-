name: CI Pipeline - Integración y Pruebas Continuas

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-validate:
    name: 🔍 Validación Estática, Linting y Configuración
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Preparar Variables de Entorno
        run: |
          cp .env.example .env

      - name: 📦 Instalar Dependencias Base
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Verificación de Sintaxis y Linting
        run: |
          # Errores críticos de sintaxis (E9, F63, F7, F82)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,backups,data,fases
          # Advertencias de estilo (máximo 127 caracteres)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,backups,data,fases

      - name: 🐳 Validar Sintaxis de Docker Compose
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml es sintácticamente válido."

      - name: 🌐 Comprobación de Integridad de Django
        run: |
          python web/manage.py check
          echo "✅ Configuración de Django validada exitosamente."

  test-suite:
    name: 🧪 Suite de Pruebas Unitarias e Integración
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Preparar Variables de Entorno
        run: |
          cp .env.example .env

      - name: 📦 Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Inicializar Esquema SQLite y Datos Experimentales
        run: |
          mkdir -p data
          python scripts/init_db.py
          python scripts/seed_experiments.py

      - name: 🚀 Ejecutar Pytest (API, Django, MQTT, Fusión y Regresiones)
        run: |
          pytest tests/ -v --junitxml=junit/test-results.xml

      - name: 📊 Publicar Reporte de Pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit/test-results.xml

  firmware-validation:
    name: ⚡ Validación de Código Firmware ESP32
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python para PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ Instalar PlatformIO CLI
        run: |
          pip install platformio==6.1.18

      - name: 🔨 Compilar y Verificar Firmware ESP32
        run: |
          cd firmware/esp32_control
          pio run
          echo "✅ Sintaxis y estructura de firmware ESP32 verificada."
