# ==============================================================================
# Docker Compose Completo: Infraestructura IoT, Inferencia y Control en Cascada
# Proyecto de Tesis: Prototipo IoT-PID-IA para Cultivo de Papa (La Paz, Bolivia)
# Servicios: Mosquitto + InfluxDB + Telegraf + Grafana + FastAPI + Inference Worker
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Eclipse Mosquitto: Broker MQTT con Autenticación Obligatoria
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - red_invernadero
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. InfluxDB v2: Almacenamiento de Series de Tiempo Microclimáticas
  # ----------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.7.5-alpine
    container_name: iot_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin_invernadero}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-TesisPapaPass2026!}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-agri_iot_tesis}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-invernadero_data}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-admin-auth-token-tesis-2026-lapaz-bolivia}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - red_invernadero
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Telegraf: Agente Colector MQTT -> InfluxDB v2 con Autenticación
  # ----------------------------------------------------------------------------
  telegraf:
    image: telegraf:1.30.0-alpine
    container_name: iot_telegraf
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-admin-auth-token-tesis-2026-lapaz-bolivia}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-agri_iot_tesis}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-invernadero_data}
      - MQTT_USERNAME=${TELEGRAF_MQTT_USERNAME:-telegraf_worker}
      - MQTT_PASSWORD=${TELEGRAF_MQTT_PASSWORD:-TesisPapaLaPaz2026!}
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - red_invernadero

  # ----------------------------------------------------------------------------
  # 4. Grafana: Visualización Analítica y Paneles de Control
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: iot_grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_tesis_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-admin-auth-token-tesis-2026-lapaz-bolivia}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-agri_iot_tesis}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-invernadero_data}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - red_invernadero

  # ----------------------------------------------------------------------------
  # 5. FastAPI Backend: Inferencia de Visión, Control de Setpoints y API REST
  # ----------------------------------------------------------------------------
  fastapi_server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: iot_fastapi_server
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${BACKEND_MQTT_USERNAME:-fastapi_server}
      - MQTT_PASSWORD=${BACKEND_MQTT_PASSWORD:-FastApiSecretPass2026!}
      - API_KEY=${API_KEY:-}
      - VISION_DEMO_MODE=${VISION_DEMO_MODE:-false}
      - SQLITE_DB_PATH=/workspace/data/invernadero_relacional.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/workspace/data
      - ./server:/workspace/server
    networks:
      - red_invernadero
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. Worker de Inferencia: Lazo Supervisor en Cascada y Fusión Multimodal
  # ----------------------------------------------------------------------------
  inference_worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: iot_inference_worker
    restart: unless-stopped
    command: ["python", "-m", "server.app.worker"]
    depends_on:
      mosquitto:
        condition: service_healthy
      fastapi_server:
        condition: service_healthy
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${BACKEND_MQTT_USERNAME:-fastapi_server}
      - MQTT_PASSWORD=${BACKEND_MQTT_PASSWORD:-FastApiSecretPass2026!}
      - API_KEY=${API_KEY:-}
      - VISION_DEMO_MODE=${VISION_DEMO_MODE:-false}
      - SQLITE_DB_PATH=/workspace/data/invernadero_relacional.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/workspace/data
      - ./server:/workspace/server
    networks:
      - red_invernadero

networks:
  red_invernadero:
    name: net_invernadero_iot
    driver: bridge

volumes:
  mosquitto_data:
    name: vol_mosquitto_data
  mosquitto_log:
    name: vol_mosquitto_log
  influxdb_data:
    name: vol_influxdb_data
  grafana_data:
    name: vol_grafana_data
