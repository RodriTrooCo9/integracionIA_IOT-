# ==========================================
# Configuración Telegraf: Ingesta MQTT -> InfluxDB v2
# ==========================================

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  logfile = ""
  debug = false
  quiet = false

# ----------------------------------------------------
# Salida: InfluxDB v2
# ----------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "5s"

# ----------------------------------------------------
# Entrada: Consumidor MQTT de Telemetría Microclimática
# ----------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = [
    "invernadero/telemetria/microclima",
    "invernadero/telemetria/pid",
    "invernadero/telemetria/actuadores",
    "invernadero/riesgo/indice"
  ]
  qos = 1
  connection_timeout = "30s"
  max_undelivered_messages = 1000

  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "invernadero/+/+"
    tags = "_/_/subtipo"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetria"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "nodo_id"
      optional = true
      type = "string"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "zona"
      optional = true
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp_aire"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hum_aire"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp_suelo"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hum_suelo"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "luz_lux"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "co2_ppm"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "vpd_kpa"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "punto_rocio"
      optional = true
      type = "float"

    # Campos de control PID
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sp_temp"
      rename = "sp_temperatura"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_temp"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cv_salida"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "termino_p"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "termino_i"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "termino_d"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pwm_calefactor"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pwm_extractor"
      optional = true
      type = "float"

    # Campos de índice de riesgo
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "score_riesgo"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "horas_hoja_humeda"
      optional = true
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sp_hum"
      rename = "sp_humedad"
      optional = true
      type = "float"
