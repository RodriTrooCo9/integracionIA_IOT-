# ==========================================
# Configuración de Eclipse Mosquitto Broker
# ==========================================

# Puerto de escucha estándar MQTT
listener 1883 0.0.0.0

# Puerto WebSockets (para clientes web directos si se requiere)
listener 9001 0.0.0.0
protocol websockets

# Autenticación obligatoria para nodos ESP32, servidores y agentes
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistencia de mensajes en disco
persistence true
persistence_location /mosquitto/data/

# Registro y diagnóstico de conexiones
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Límites de retención y buffers
max_queued_messages 1000
autosave_interval 1800
