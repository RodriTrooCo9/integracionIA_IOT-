; ==============================================================================
; PlatformIO Configuration - Firmware ESP32 Control Invernadero Papa
; Proyecto: Tesis IoT-PID-IA Papa (La Paz, Bolivia)
; ==============================================================================

[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Optimización y advertencias del compilador
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=1024

; Librerías de sensores, actuadores y conectividad con versiones fijadas
lib_deps =
    bblanchon/ArduinoJson @ 7.0.4
    knolleary/PubSubClient @ 2.8
    robtillaart/SHT31 @ 0.5.0
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    claws/BH1750 @ 1.3.0
